[project]
name = "daemon"
version = "0.1.0"
description = "Long-running process that owns the schedule and runs the vaulty agent on it."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "github",
    "scheduler",
    "vaulty",
]

[project.scripts]
vaulty-daemon = "daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daemon"]

[tool.uv.sources]
github = { workspace = true }
scheduler = { workspace = true }
vaulty = { workspace = true }

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
