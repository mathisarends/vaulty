[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.workspace]
members = [
    "vaulty",
    "scheduler",
    "daemon",
    "github",
]

[tool.uv.sources]
vaulty = { workspace = true }
scheduler = { workspace = true }
daemon = { workspace = true }
github = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["vaulty", "scheduler", "daemon", "github"]
