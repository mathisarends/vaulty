[project]
name = "cli"
version = "0.1.0"
description = "Vaulty's interactive terminal client."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "rich>=14.2.0",
    "runtime",
    "storage",
    "vaulty",
]

[project.scripts]
vaulty = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.uv.sources]
runtime = { workspace = true }
storage = { workspace = true }
vaulty = { workspace = true }

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
