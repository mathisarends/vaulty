[project]
name = "runtime"
version = "0.1.0"
description = "Wires the vaulty agent to a session store."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "storage",
    "vaulty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime"]

[tool.uv.sources]
storage = { workspace = true }
vaulty = { workspace = true }

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
