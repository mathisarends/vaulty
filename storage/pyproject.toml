[project]
name = "storage"
version = "0.1.0"
description = "Async storage for agent conversation sessions."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.22.0,<0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[tool.ruff]
extend = "../pyproject.toml"
