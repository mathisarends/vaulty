root: C:\obsidian\database

llm:
  model: gpt-5.6-luna
  reasoning_effort: medium
  timeout_seconds: 120
  max_retries: 3

compaction:
  enabled: true
  # Resolved from the model profile in vaulty/llm.py when omitted.
  # context_window_tokens: 272000
  trigger_fraction: 0.8
  retain_tokens: 32000

scheduler:
  # Runtime state, relative to the working directory - kept out of the vault.
  database: .vaulty/scheduler.db
  timezone: Europe/Berlin
  tasks:
    - id: daily-gardening
      name: daily
      cron: "0 4 * * *"
      prompt: Read Daily Review Instructions and follow the instructions

sessions:
  # Conversation transcripts, shared by the CLI and the daemon.
  database: .vaulty/sessions.db

sandbox:
  image: vaulty-sandbox:latest
  timeout_seconds: 60
  max_output_bytes: 262144
  enable_network: true
  memory_bytes: 536870912
  cpus: 1.0
  pids: 256
